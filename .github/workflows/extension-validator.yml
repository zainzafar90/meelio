name: Extension Validator

on:
  pull_request:
    paths:
      - ".github/workflows/extension-validator.yml"
      - "apps/extension/**"
      - "packages/shared/**"
      - "packages/timer-core/**"
      - "scripts/validate/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/extension-validator.yml"
      - "apps/extension/**"
      - "packages/shared/**"
      - "packages/timer-core/**"
      - "scripts/validate/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  validate-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run shared timer-core boundary tests
        run: pnpm --filter @repo/shared test -- --run

      - name: Run web timer-core boundary tests
        run: pnpm --filter web test -- --run

      - name: Verify web build
        run: pnpm --filter web build

      - name: Run extension validator
        env:
          MEELIO_BLOCK_TEST_DOMAIN: zainzafar.net
          MEELIO_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a pnpm validate:extension
